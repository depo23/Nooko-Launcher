name: Feature request
description: Suggest an idea for Nooko Launcher
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Nooko Launcher stays small on purpose. Please read [what's in and out of scope](https://github.com/depo23/Nooko-Launcher/blob/main/CONTRIBUTING.md#whats-out-of-scope) before suggesting something.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you picture it working. Sketches, mockups or screenshots are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
  - type: checkboxes
    id: scope
    attributes:
      label: Fit with Nooko Launcher
      options:
        - label: This doesn't add ads, tracking, an account, or a third-party library.
          required: true
        - label: I'd like to build this myself (please wait for a reply before starting).
